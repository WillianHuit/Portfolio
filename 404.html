<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>Página no encontrada | Willian Huit</title>

    <link rel="icon" type="image/x-icon" href="src/img/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="src/img/apple-touch-icon.png">
    <meta name="theme-color" content="#6366f1">

    <!-- Mismo criterio que en index.html: el tema se aplica antes del
         primer pintado para que no haya destello blanco. -->
    <script>
    (function () {
        try {
            var t = localStorage.getItem('theme');
            if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            if (t === 'dark') document.documentElement.classList.add('dark-mode');
        } catch (e) {}
    })();
    </script>

    <style>
        :root {
            --primary: #6366f1;
            --secondary: #8b5cf6;
            --accent: #ec4899;
            --text: #1f2937;
            --text-soft: #6b7280;
            --bg: #ffffff;
            --surface: #f3f4f6;
        }

        html.dark-mode {
            --text: #f9fafb;
            --text-soft: #d1d5db;
            --bg: #111827;
            --surface: #1f2937;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem 1.5rem;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            line-height: 1.6;
            text-align: center;
        }

        .code {
            font-size: clamp(6rem, 22vw, 11rem);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.04em;
            background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        h1 {
            font-size: clamp(1.35rem, 4vw, 1.9rem);
            margin: 0.5rem 0 0.75rem;
        }

        p {
            color: var(--text-soft);
            max-width: 46ch;
            margin: 0 auto 2rem;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.85rem;
            justify-content: center;
        }

        a {
            display: inline-block;
            padding: 0.8rem 1.6rem;
            border-radius: 0.5rem;
            font-weight: 600;
            text-decoration: none;
            transition: transform 200ms ease, box-shadow 200ms ease;
        }

        .primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
        }

        .ghost {
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        a:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.15);
        }

        @media (prefers-reduced-motion: reduce) {
            a { transition: none; }
            a:hover { transform: none; }
        }
    </style>
</head>
<body>
    <main>
        <p class="code" aria-hidden="true">404</p>
        <h1>Esta página no existe</h1>
        <p>
            El enlace que seguiste puede estar roto o la página pudo haberse movido.
            Desde el inicio puedes llegar a todo el portafolio.
        </p>
        <div class="actions">
            <a class="primary" href="/Portfolio/">Ir al inicio</a>
            <a class="ghost" href="/Portfolio/#projects">Ver proyectos</a>
        </div>
    </main>
</body>
</html>
